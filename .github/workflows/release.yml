name: Release (Nomix)

on:
  pull_request:
  push:
    branches: [npm-nomix-harness]
    tags: ['nomix-v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/npm-nomix-harness' }}

env:
  PRIMARY_NODE_VERSION: '24'
  NOMIX_TELEMETRY_DISABLED: '1'

jobs:
  landlock-matrix:
    name: Landlock matrix
    runs-on: ubuntu-24.04
    outputs:
      prebuilds: ${{ steps.matrix.outputs.prebuilds }}
    steps:
      - uses: actions/checkout@v6

      - id: matrix
        run: echo "prebuilds=$(node native/landlock-run/scripts/github-matrix.mjs release-prebuild)" >> "$GITHUB_OUTPUT"

  build-landlock:
    name: Build ${{ matrix.package }}
    needs: landlock-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.landlock-matrix.outputs.prebuilds) }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install native workspace
        run: pnpm install --filter @nomix-ai/node-addon-landlock-run-workspace... --frozen-lockfile

      - name: Install musl toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq musl-tools

      - name: Build native binary
        run: pnpm --dir native/landlock-run build:native

      - name: Verify binary metadata
        run: node native/landlock-run/scripts/verify-launcher-binary.mjs ${{ matrix.dir }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: native/landlock-run/${{ matrix.dir }}/bin/*
          if-no-files-found: error
          retention-days: 7

  pack:
    name: Build and pack npm artifact
    needs: build-landlock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Use the pinned npm client
        run: npm install --global npm@12.0.2

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Download Landlock prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: native/landlock-run/.release/prebuild-artifacts

      - name: Assemble Landlock prebuilds
        run: node native/landlock-run/scripts/assemble-prebuilds.mjs native/landlock-run/.release/prebuild-artifacts

      - name: Verify release version
        env:
          RELEASE_PUBLISH: ${{ github.ref == 'refs/heads/npm-nomix-harness' && 'true' || 'false' }}
        run: pnpm run release:verify --family nomix

      - name: Build official workspaces
        run: pnpm run build:official

      - name: Pack release tarball
        run: pnpm run release:pack --family nomix --out dist/npm

      - name: Verify Linux packed install
        run: pnpm run release:verify-packed-install --family nomix --from dist/npm

      - uses: actions/upload-artifact@v4
        with:
          name: nomix-npm-tarballs
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 7

  verify-platform:
    name: Verify packed install (${{ matrix.name }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: nomix-npm-tarballs
          path: dist/npm

      - name: Verify script-free packed install
        run: node scripts/release/verify-packed-install.ts --family nomix --from dist/npm

  verify-consumer:
    name: Verify ${{ matrix.manager }} consumer
    needs: pack
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: nomix-npm-tarballs
          path: dist/npm

      - name: Verify script-free consumer install
        run: node scripts/release/verify-packed-install.ts --family nomix --from dist/npm --manager ${{ matrix.manager }}

  publish:
    name: Publish npm package with provenance
    if: github.ref == 'refs/heads/npm-nomix-harness'
    needs: [pack, verify-platform, verify-consumer]
    runs-on: ubuntu-24.04
    environment: npm-publish
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Use the pinned npm client
        run: npm install --global npm@12.0.2

      - name: Install release scripts only
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: nomix-npm-tarballs
          path: dist/npm

      - name: Publish exact packed bytes
        run: pnpm run release:publish --family nomix --from dist/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify version, latest, integrity, and provenance
        shell: bash
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          for attempt in {1..18}; do
            published=$(npm view @nomix-ai/nomix-harness version --registry https://registry.npmjs.org 2>/dev/null || true)
            latest=$(npm view @nomix-ai/nomix-harness dist-tags.latest --registry https://registry.npmjs.org 2>/dev/null || true)
            integrity=$(npm view "@nomix-ai/nomix-harness@$version" dist.integrity --registry https://registry.npmjs.org 2>/dev/null || true)
            signature=$(npm view "@nomix-ai/nomix-harness@$version" dist.signatures.0.sig --registry https://registry.npmjs.org 2>/dev/null || true)
            signature_key=$(npm view "@nomix-ai/nomix-harness@$version" dist.signatures.0.keyid --registry https://registry.npmjs.org 2>/dev/null || true)
            attestation=$(npm view "@nomix-ai/nomix-harness@$version" dist.attestations.url --registry https://registry.npmjs.org 2>/dev/null || true)
            predicate=$(npm view "@nomix-ai/nomix-harness@$version" dist.attestations.provenance.predicateType --registry https://registry.npmjs.org 2>/dev/null || true)
            if [[ "$published" == "$version" && "$latest" == "$version" && -n "$integrity" && -n "$signature" && -n "$signature_key" && -n "$attestation" && -n "$predicate" ]]; then
              break
            fi
            sleep 10
          done
          if [[ "$published" != "$version" || "$latest" != "$version" || -z "$integrity" || -z "$signature" || -z "$signature_key" || -z "$attestation" || -z "$predicate" ]]; then
            printf 'registry verification failed: version=%s latest=%s integrity=%s signature=%s key=%s attestation=%s predicate=%s\n' "$published" "$latest" "$integrity" "$signature" "$signature_key" "$attestation" "$predicate" >&2
            exit 1
          fi

          audit_dir=$(mktemp -d)
          cd "$audit_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --save-exact "@nomix-ai/nomix-harness@$version"
          installed=$(npm exec --offline -- nomix --version)
          if [[ "$installed" != "$version" ]]; then
            printf 'installed package reported version=%s, expected=%s\n' "$installed" "$version" >&2
            exit 1
          fi
          printf 'verified %s latest=%s integrity=%s signature-key=%s attestation=%s predicate=%s\n' "$published" "$latest" "$integrity" "$signature_key" "$attestation" "$predicate"
