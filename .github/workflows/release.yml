name: Release (Nomix)

on:
  pull_request:
  push:
    branches: [npm-nomix-harness]
    tags: ['nomix-v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/npm-nomix-harness' }}

env:
  PRIMARY_NODE_VERSION: '24'
  NOMIX_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Build and pack npm artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Use the pinned npm client
        run: npm install --global npm@12.0.2

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        env:
          RELEASE_PUBLISH: ${{ github.ref == 'refs/heads/npm-nomix-harness' && 'true' || 'false' }}
        run: pnpm run release:verify --family nomix

      - name: Verify Nomix branding
        run: pnpm run verify-nomix-branding

      - name: Build workspaces and native npm distribution
        run: pnpm run build

      - name: Pack release tarball
        run: pnpm run release:pack --family nomix --out dist/npm

      - name: Verify Linux packed install
        run: pnpm run release:verify-packed-install --family nomix --from dist/npm

      - uses: actions/upload-artifact@v4
        with:
          name: nomix-npm-tarballs
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 7

  verify-platform:
    name: Verify packed install (${{ matrix.name }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: nomix-npm-tarballs
          path: dist/npm

      - name: Verify script-free packed install
        run: node scripts/release/verify-packed-install.ts --family nomix --from dist/npm

  verify-consumer:
    name: Verify ${{ matrix.manager }} consumer
    needs: pack
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, yarn]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: nomix-npm-tarballs
          path: dist/npm

      - name: Verify script-free consumer install
        run: node scripts/release/verify-packed-install.ts --family nomix --from dist/npm --manager ${{ matrix.manager }}

  publish:
    name: Publish npm package with provenance
    if: github.ref == 'refs/heads/npm-nomix-harness'
    needs: [pack, verify-platform, verify-consumer]
    runs-on: ubuntu-24.04
    environment: npm-publish
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Use the pinned npm client
        run: npm install --global npm@12.0.2

      - name: Install release scripts only
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: nomix-npm-tarballs
          path: dist/npm

      - name: Publish exact packed bytes
        run: pnpm run release:publish --family nomix --from dist/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify version, latest, integrity, and provenance
        shell: bash
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          for attempt in {1..18}; do
            published=$(npm view @nomix-ai/nomix-harness version --registry https://registry.npmjs.org 2>/dev/null || true)
            latest=$(npm view @nomix-ai/nomix-harness dist-tags.latest --registry https://registry.npmjs.org 2>/dev/null || true)
            integrity=$(npm view "@nomix-ai/nomix-harness@$version" dist.integrity --registry https://registry.npmjs.org 2>/dev/null || true)
            attestation=$(npm view "@nomix-ai/nomix-harness@$version" dist.attestations.url --registry https://registry.npmjs.org 2>/dev/null || true)
            if [[ "$published" == "$version" && "$latest" == "$version" && -n "$integrity" && -n "$attestation" ]]; then
              break
            fi
            sleep 10
          done
          if [[ "$published" != "$version" || "$latest" != "$version" || -z "$integrity" || -z "$attestation" ]]; then
            printf 'registry verification failed: version=%s latest=%s integrity=%s attestation=%s\n' "$published" "$latest" "$integrity" "$attestation" >&2
            exit 1
          fi

          audit_dir=$(mktemp -d)
          cd "$audit_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --save-exact "@nomix-ai/nomix-harness@$version"
          npm audit signatures
          printf 'verified %s latest=%s integrity=%s attestation=%s\n' "$published" "$latest" "$integrity" "$attestation"
