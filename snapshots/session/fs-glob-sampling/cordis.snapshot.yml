# Minimal keyless composition: real app, bash, and search tool; replayed model.
- id: llm-deepseek
  name: '@nomix-ai/nomix-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@nomix-ai/nomix-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- id: subprocess
  name: '@nomix-ai/nomix-subprocess-local'

- id: agent-default-model
  name: '@nomix-ai/nomix-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@nomix-ai/nomix-session-persistence-jsonl'
  config:
    root: !!js nomixHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@nomix-ai/nomix-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@nomix-ai/nomix-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@nomix-ai/nomix-tool-jobs'
  disabled: true

- id: goal
  name: '@nomix-ai/nomix-goal'
  disabled: true

- id: goal-round-driver
  name: '@nomix-ai/nomix-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@nomix-ai/nomix-command-goal'
  disabled: true

- id: tool-goal
  name: '@nomix-ai/nomix-tool-goal'
  disabled: true

- id: skill
  name: '@nomix-ai/nomix-skill'
  disabled: true

- id: skill-filesystem
  name: '@nomix-ai/nomix-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@nomix-ai/nomix-tool-skill'
  disabled: true

- id: tool-fs-search
  name: '@nomix-ai/nomix-tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4

- id: spill-local
  name: '@nomix-ai/nomix-spill-local'
  config:
    root: !!js process.env.NOMIX_SNAPSHOT_SPILL_ROOT ?? './.spill'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.NOMIX_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.NOMIX_SNAPSHOT_SPILL_LOCATOR_ROOT
