# Add the persisted goal domain and its model-facing tools to the real one-shot app.
- id: base
  name: '@nomix-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: goal
            name: '@nomix-ai/nomix-goal'
          - id: tool-goal
            name: '@nomix-ai/nomix-tool-goal'
