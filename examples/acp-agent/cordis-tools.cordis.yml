# Add the self-referential Cordis tools without changing the base ACP tool
# presentation mode.
- id: base
  name: '@nomix-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: cordis-host-runner
            name: '@nomix-ai/nomix-cordis-host-runner'
          - id: tool-cordis
            name: '@nomix-ai/nomix-tool-cordis'
